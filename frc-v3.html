<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRC Sistema Financeiro v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.15.0/Recharts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060D1B;color:#F1F5F9;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0D1526}
::-webkit-scrollbar-thumb{background:#243049;border-radius:4px}
select,input{outline:none}
select option{background:#151F32;color:#F1F5F9}
table{border-spacing:0}
button:hover{opacity:0.85;transform:scale(0.98)}
button:active{transform:scale(0.96)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;
const {BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,PieChart,Pie,Cell,Legend,LineChart,Line,ComposedChart,ReferenceLine}=Recharts;

// ═══ THEME ═══
const C={bg:"#060D1B",s1:"#0D1526",s2:"#151F32",s3:"#1E2A40",s4:"#273350",border:"#243049",g:"#00E5A0",b:"#3B82F6",w:"#F59E0B",r:"#EF4444",p:"#8B5CF6",pk:"#EC4899",text:"#F1F5F9",mt:"#8896AB",dm:"#566378"};
const PC=["#00E5A0","#3B82F6","#FF6B35","#F59E0B","#8B5CF6","#EC4899","#14B8A6","#EF4444","#6366F1","#22D3EE","#A855F7","#84CC16"];

// ═══ CATEGORIES ═══
const COST_ADM=["PRO-LABORE","COMISSOES","DESPESAS ADM","CONTABIL","JURIDICO","CAIXA 2"];
const COST_OPS=["IMPOSTOS","LOGISTICA","MARKETING","SALARIOS","OFICINA","OPERACIONAL","SEGUROS","TARIFAS","MANUTENCAO"];
const COST_INV=["SUBLOCACAO","FINANCIAMENTOS","INVESTIMENTOS","EMPRESTIMOS","FIN & INVEST"];
const ALL_CATS=[...new Set([...COST_ADM,...COST_OPS,...COST_INV,"DEVOLUCOES"])];
const SUBCATS={"SALARIOS":["FUNCIONARIOS","COMISSOES","BONUS"],"MARKETING":["MKT-AGENCIAS","MKT-TRAFEGO","MKT-PATROCINIOS","MKT-INFLUENCE","MKT FIXO","EDITOR VIDEOS"],"DESPESAS ADM":["ESTRUTURA FIXA","MATERIAL CONSUMO","SERVICOS TERCEIRIZADOS","TAXAS BANCARIAS","COMBUSTIVEL","AEROPORTO","CAR WASH","EPASS","EMPLACAMENTO"],"PRO-LABORE":["PRO-LABORE FABINHO","PRO-LABORE TT","PRO-LABORE ELIZABETH"],"SUBLOCACAO":["SUBLOCACOES"],"MANUTENCAO":["MÃO DE OBRA","PEÇAS","BATERIA","PNEU"],"LOGISTICA":["AEROPORTO/COMBUSTIVEL/CARWASH","EPASS","DRIVES"],"OFICINA":["MECANICOS","FUNILARIA"],"OPERACIONAL":["DRIVES","GUINCHO","CHAVEIRO"],"EMPRESTIMOS":["JUROS","EMPRESTIMOS INVESTIMENTO"],"FINANCIAMENTOS":["VEICULOS","EQUIPAMENTOS"],"INVESTIMENTOS":["EXPANSAO","FROTA"]};
const BANKS=["SICREDI","BRADESCO","ITAU","PAGARME","SANTANDER","NOMAD","MERCADO PAGO","REGIONS","TRUIST","PNC","STRIPE","DINHEIRO"];
const REV_CATS=["ALUGUEL VEICULOS","CHIP/ACESSORIOS","SEGURO CLIENTE","MULTAS","TAXA EXTRA","PARCEIRO","OUTROS"];

// ═══ HELPERS ═══
const fmt=v=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
const fK=v=>{if(Math.abs(v)>=1e6)return(v/1e6).toFixed(1)+"M";if(Math.abs(v)>=1e3)return(v/1e3).toFixed(1)+"k";return v.toFixed(0)};
const td=()=>new Date().toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const wk=d=>{const day=new Date(d+"T12:00:00").getDate();return day<=7?1:day<=14?2:day<=21?3:4};
const wkR=(y,m,w)=>{const s=(w-1)*7+1;const e=w===4?new Date(y,m,0).getDate():Math.min(s+6,new Date(y,m,0).getDate());return String(s).padStart(2,'0')+"/"+String(m).padStart(2,'0')+" - "+String(e).padStart(2,'0')+"/"+String(m).padStart(2,'0')};
const dN=d=>["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(d+"T12:00:00").getDay()];

// localStorage helpers
const ld=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}};
const sv=(k,d)=>{try{localStorage.setItem(k,JSON.stringify(d))}catch(e){console.error(e)}};

// ═══ UI COMPONENTS ═══
const Btn=({children,onClick,v="p",sm,style:sx,...p})=>{
  const S={p:{background:"linear-gradient(135deg,#00E5A0,#059669)",color:"#060D1B"},s:{background:"#151F32",color:"#F1F5F9",border:"1px solid #243049"},d:{background:"#EF444418",color:"#EF4444",border:"1px solid #EF444435"},g:{background:"transparent",color:"#8896AB"},ok:{background:"#00E5A015",color:"#00E5A0",border:"1px solid #00E5A035"},no:{background:"#EF444415",color:"#EF4444",border:"1px solid #EF444435"},w:{background:"#F59E0B15",color:"#F59E0B",border:"1px solid #F59E0B35"}};
  return React.createElement("button",{onClick,style:{border:"none",cursor:"pointer",borderRadius:7,fontFamily:"inherit",transition:"all .12s",padding:sm?"4px 8px":"8px 14px",fontSize:sm?9:11,fontWeight:800,...S[v],...sx},...p},children);
};

const Inp=({label,value,onChange,type,options,ph,style:sx,...p})=>{
  const base={background:"#1E2A40",border:"1px solid #243049",borderRadius:6,padding:"6px 8px",color:"#F1F5F9",fontSize:11,fontFamily:"inherit"};
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:2,...sx}},
    label&&React.createElement("label",{style:{color:"#566378",fontSize:9,fontWeight:800,letterSpacing:.6}},label),
    options?React.createElement("select",{value,onChange:e=>onChange(e.target.value),style:base,...p},
      React.createElement("option",{value:""},"—"),
      options.map(o=>React.createElement("option",{key:o,value:o},o))
    ):React.createElement("input",{type:type||"text",value,onChange:e=>onChange(e.target.value),placeholder:ph,style:base,...p})
  );
};

const Card=({children,style:sx})=>React.createElement("div",{className:"fade-in",style:{background:"#0D1526",borderRadius:11,border:"1px solid #243049",padding:12,...sx}},children);

const Bd=({children,color})=>React.createElement("span",{style:{background:(color||"#00E5A0")+"18",color:color||"#00E5A0",fontSize:8,fontWeight:900,padding:"2px 6px",borderRadius:3,letterSpacing:.3,whiteSpace:"nowrap"}},children);

const KPI=({icon,title,value,sub,color})=>React.createElement(Card,{style:{position:"relative",overflow:"hidden"}},
  React.createElement("div",{style:{position:"absolute",top:-10,right:-10,width:44,height:44,borderRadius:"50%",background:color||C.g,opacity:.06}}),
  React.createElement("p",{style:{color:C.dm,fontSize:8,fontWeight:900,letterSpacing:1.5,textTransform:"uppercase",margin:0}},icon+" "+title),
  React.createElement("p",{style:{color:C.text,fontSize:19,fontWeight:900,margin:"4px 0 1px",fontFamily:"'JetBrains Mono',monospace"}},value),
  sub&&React.createElement("p",{style:{color:C.dm,fontSize:9,margin:0}},sub)
);

const Sec=({children,sub})=>React.createElement("div",{style:{marginBottom:4,marginTop:20}},
  React.createElement("h2",{style:{color:C.text,fontSize:14,fontWeight:900,margin:0}},children),
  sub&&React.createElement("p",{style:{color:C.dm,fontSize:10,margin:"2px 0 0"}},sub),
  React.createElement("div",{style:{width:36,height:2,background:"linear-gradient(90deg,#00E5A0,#3B82F6)",borderRadius:2,marginTop:5}})
);

const Modal=({show,onClose,title,children,wide})=>{
  if(!show)return null;
  return React.createElement("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.78)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:12},onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement("div",{style:{background:C.s1,borderRadius:13,border:"1px solid "+C.border,padding:18,width:"100%",maxWidth:wide?680:440,maxHeight:"92vh",overflow:"auto"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        React.createElement("h2",{style:{margin:0,fontSize:15,fontWeight:900}},title),
        React.createElement(Btn,{v:"g",sm:true,onClick:onClose},"✕")
      ),
      children
    )
  );
};

// ═══ MAIN APP ═══
function FRC(){
  const [view,setView]=useState("dash");
  const [items,setItems]=useState([]);
  const [bals,setBals]=useState([]);
  const [boxes,setBoxes]=useState([]);
  const [cambioFloat,setCambioFloat]=useState(5.70);
  const [showForm,setShowForm]=useState(false);
  const [showBal,setShowBal]=useState(false);
  const [showBox,setShowBox]=useState(false);
  const [editId,setEditId]=useState(null);
  const [selMonth,setSelMonth]=useState(new Date().toISOString().slice(0,7));
  const [selCat,setSelCat]=useState("");

  const blankItem={date:td(),desc:"",dir:"saida",categoria:"",sub_categoria:"",valor:"",moeda:"BRL",status:"A PAGAR",tipo:"planejado",banco:"",cambio_tx:"",obs:""};
  const [form,setForm]=useState({...blankItem});
  const [balForm,setBalForm]=useState({date:td(),saldo_brl:"",saldo_usd:""});
  const [boxForm,setBoxForm]=useState({name:"",target:"",moeda:"USD"});

  // Load on mount
  useEffect(()=>{
    const i=ld("frc3-items");const b=ld("frc3-bals");const bx=ld("frc3-boxes");const cf=ld("frc3-cambio");
    if(i)setItems(i);if(b)setBals(b);if(bx)setBoxes(bx);if(cf)setCambioFloat(cf);
  },[]);

  const persist=useCallback((i,b,bx)=>{sv("frc3-items",i);sv("frc3-bals",b);sv("frc3-boxes",bx);sv("frc3-cambio",cambioFloat)},[cambioFloat]);

  // CRUD
  const saveItem=()=>{
    if(!form.desc||!form.valor)return;
    const tx=parseFloat(form.cambio_tx)||cambioFloat;
    const p={...form,valor:parseFloat(form.valor),cambio_tx:tx,id:editId||Date.now().toString()};
    const u=editId?items.map(x=>x.id===editId?p:x):[...items,p];
    setItems(u);persist(u,bals,boxes);setForm({...blankItem});setShowForm(false);setEditId(null);
  };
  const delItem=id=>{const u=items.filter(x=>x.id!==id);setItems(u);persist(u,bals,boxes)};
  const markPaid=id=>{const u=items.map(x=>x.id===id?{...x,status:"PAGO",tipo:"realizado",cambio_tx:x.cambio_tx||cambioFloat}:x);setItems(u);persist(u,bals,boxes)};
  const editItem=p=>{setForm({...p,valor:p.valor.toString(),cambio_tx:p.cambio_tx?.toString()||""});setEditId(p.id);setShowForm(true)};
  const saveBal=()=>{
    const b={id:Date.now().toString(),date:balForm.date,saldo_brl:parseFloat(balForm.saldo_brl)||0,saldo_usd:parseFloat(balForm.saldo_usd)||0};
    const u=[...bals.filter(x=>x.date!==b.date),b].sort((a,c)=>a.date.localeCompare(c.date));
    setBals(u);persist(items,u,boxes);setShowBal(false);setBalForm({date:td(),saldo_brl:"",saldo_usd:""});
  };
  const saveBox=()=>{
    if(!boxForm.name||!boxForm.target)return;
    const bx={id:Date.now().toString(),name:boxForm.name,target:parseFloat(boxForm.target),moeda:boxForm.moeda,current:0};
    const u=[...boxes,bx];setBoxes(u);persist(items,bals,u);setShowBox(false);setBoxForm({name:"",target:"",moeda:"USD"});
  };
  const delBox=id=>{const u=boxes.filter(x=>x.id!==id);setBoxes(u);persist(items,bals,u)};
  const saveCambio=v=>{setCambioFloat(v);sv("frc3-cambio",v)};

  // Helpers
  const toUSD=useCallback((val,moeda,tx)=>moeda==="USD"?val:val/(tx||cambioFloat),[cambioFloat]);
  const [ym,mm]=selMonth.split("-").map(Number);

  // ═══ COMPUTED ═══
  const monthItems=useMemo(()=>{
    const inM=items.filter(p=>p.date.startsWith(selMonth));
    const over=items.filter(p=>!p.date.startsWith(selMonth)&&p.date<selMonth+"-01"&&p.status==="A PAGAR"&&p.dir==="saida");
    return [...inM,...over.map(p=>({...p,_overdue:true}))].sort((a,b)=>a.date.localeCompare(b.date));
  },[items,selMonth]);

  const expenses=useMemo(()=>monthItems.filter(p=>p.dir==="saida"),[monthItems]);
  const revenues=useMemo(()=>monthItems.filter(p=>p.dir==="entrada"),[monthItems]);

  const todayItems=useMemo(()=>{
    const t=td();
    const tdy=items.filter(p=>p.date===t);
    const over=items.filter(p=>p.date<t&&p.status==="A PAGAR");
    return [...tdy,...over.map(p=>({...p,_overdue:true}))].sort((a,b)=>(b._overdue?1:0)-(a._overdue?1:0)||a.date.localeCompare(b.date));
  },[items]);

  const stats=useMemo(()=>{
    const revUSD=revenues.reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
    const pagoUSD=expenses.filter(p=>p.status==="PAGO").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
    const pendUSD=expenses.filter(p=>p.status==="A PAGAR").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
    const totalExp=pagoUSD+pendUSD;
    const adm=expenses.reduce((a,p)=>COST_ADM.includes(p.categoria)?a+toUSD(p.valor,p.moeda,p.cambio_tx):a,0);
    const ops=expenses.reduce((a,p)=>COST_OPS.includes(p.categoria)?a+toUSD(p.valor,p.moeda,p.cambio_tx):a,0);
    const inv=expenses.reduce((a,p)=>COST_INV.includes(p.categoria)?a+toUSD(p.valor,p.moeda,p.cambio_tx):a,0);
    return {revUSD,pagoUSD,pendUSD,totalExp,adm,ops,inv,lucro:revUSD-totalExp};
  },[expenses,revenues,toUSD]);

  // 6-week view
  const weekView=useMemo(()=>{
    const t=new Date(td()+"T12:00:00");
    const result=[];
    for(let off=-4;off<=2;off++){
      const dt=new Date(t);dt.setDate(dt.getDate()+off*7);
      const y=dt.getFullYear(),m=dt.getMonth()+1,w=wk(dt.toISOString().slice(0,10));
      const mS=y+"-"+String(m).padStart(2,'0');
      const wI=items.filter(p=>p.date.slice(0,7)===mS&&wk(p.date)===w);
      const rev=wI.filter(p=>p.dir==="entrada").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
      const exp=wI.filter(p=>p.dir==="saida").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
      result.push({key:mS+"-W"+w,range:wkR(y,m,w),rev,exp,result:rev-exp,isCurrent:off===0,isPast:off<0,isFuture:off>0});
    }
    return result;
  },[items,toUSD]);

  // Revenue daily last 7 days
  const revDaily=useMemo(()=>{
    const r=[];
    for(let i=6;i>=0;i--){
      const d=addD(td(),-i);
      const rev=items.filter(p=>p.date===d&&p.dir==="entrada").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
      const exp=items.filter(p=>p.date===d&&p.dir==="saida"&&p.status==="PAGO").reduce((a,p)=>a+toUSD(p.valor,p.moeda,p.cambio_tx),0);
      r.push({d:d.slice(5),day:dN(d),rev,exp,result:rev-exp});
    }
    return r;
  },[items,toUSD]);

  // Reconciliation
  const recon=useMemo(()=>{
    const t=td(),y=addD(t,-1);
    const yB=bals.find(b=>b.date===y),tB=bals.find(b=>b.date===t);
    const tRev=items.filter(p=>p.date===t&&p.dir==="entrada"&&p.status==="PAGO");
    const tExp=items.filter(p=>p.date===t&&p.dir==="saida"&&p.status==="PAGO");
    const rB=tRev.filter(p=>p.moeda==="BRL").reduce((a,p)=>a+p.valor,0);
    const rU=tRev.filter(p=>p.moeda==="USD").reduce((a,p)=>a+p.valor,0);
    const eB=tExp.filter(p=>p.moeda==="BRL").reduce((a,p)=>a+p.valor,0);
    const eU=tExp.filter(p=>p.moeda==="USD").reduce((a,p)=>a+p.valor,0);
    const exB=(yB?.saldo_brl||0)+rB-eB;
    const exU=(yB?.saldo_usd||0)+rU-eU;
    return {yB,tB,rB,rU,eB,eU,exB,exU,dB:tB?(tB.saldo_brl-exB):null,dU:tB?(tB.saldo_usd-exU):null};
  },[items,bals]);

  const reserveItems=useMemo(()=>expenses.filter(p=>p.status==="A PAGAR"&&((p.moeda==="USD"&&p.valor>=5000)||(p.moeda==="BRL"&&p.valor>=40000))).map(p=>({...p,usd:toUSD(p.valor,p.moeda,p.cambio_tx)})),[expenses,toUSD]);

  const lastBal=bals.length>0?bals[bals.length-1]:null;
  const saldoUSD=lastBal?(lastBal.saldo_brl/cambioFloat+lastBal.saldo_usd):0;

  const catBreak=useMemo(()=>{
    const c={};
    expenses.forEach(p=>{const k=p.categoria||"OUTROS";if(!c[k])c[k]={plan:0,real:0,items:[]};const u=toUSD(p.valor,p.moeda,p.cambio_tx);if(p.tipo==="planejado")c[k].plan+=u;else c[k].real+=u;c[k].items.push(p)});
    return c;
  },[expenses,toUSD]);

  const subBreak=useMemo(()=>{
    if(!selCat||!catBreak[selCat])return[];
    const s={};catBreak[selCat].items.forEach(p=>{const k=p.sub_categoria||"GERAL";if(!s[k])s[k]={total:0,count:0};s[k].total+=toUSD(p.valor,p.moeda,p.cambio_tx);s[k].count++});
    return Object.entries(s).sort((a,b)=>b[1].total-a[1].total);
  },[selCat,catBreak,toUSD]);

  const formCats=form.dir==="entrada"?REV_CATS:ALL_CATS;
  const formSubs=SUBCATS[form.categoria]||[];
  const views=[{id:"dash",label:"📊 Dash"},{id:"weekly",label:"📅 Semanas"},{id:"recon",label:"🔄 Caixa"},{id:"reserve",label:"🏦 Reservas"},{id:"kpi",label:"📈 KPIs"}];

  // ═══ RENDER ═══
  const todayExp=todayItems.filter(p=>p.dir==="saida");
  const todayRev=todayItems.filter(p=>p.dir==="entrada");

  return React.createElement("div",{style:{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"'Segoe UI',system-ui,sans-serif"}},
    // HEADER
    React.createElement("div",{style:{background:C.s1,borderBottom:"1px solid "+C.border,padding:"10px 16px",position:"sticky",top:0,zIndex:200}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6,maxWidth:1320,margin:"0 auto"}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:7}},
          React.createElement("div",{style:{width:30,height:30,borderRadius:7,background:"linear-gradient(135deg,#00E5A0,#3B82F6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:C.bg}},"F"),
          React.createElement("div",null,
            React.createElement("h1",{style:{margin:0,fontSize:13,fontWeight:900}},"FRC Financeiro"),
            React.createElement("p",{style:{margin:0,fontSize:8,color:C.dm,fontWeight:700,letterSpacing:1.2}},"v3 • OPERACIONAL")
          )
        ),
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:3,background:C.s2,borderRadius:6,padding:"3px 8px",border:"1px solid "+C.border}},
            React.createElement("span",{style:{fontSize:9,color:C.dm,fontWeight:800}},"USD/BRL"),
            React.createElement("input",{type:"number",value:cambioFloat,onChange:e=>saveCambio(parseFloat(e.target.value)||5.7),step:"0.01",style:{width:48,background:"transparent",border:"none",color:C.g,fontSize:12,fontWeight:900,fontFamily:"monospace",textAlign:"right"}})
          ),
          React.createElement("input",{type:"month",value:selMonth,onChange:e=>setSelMonth(e.target.value),style:{background:C.s2,border:"1px solid "+C.border,borderRadius:6,padding:"4px 8px",color:C.text,fontSize:10,fontFamily:"inherit"}}),
          React.createElement("div",{style:{display:"flex",gap:1,background:C.s2,borderRadius:7,padding:2}},
            views.map(t=>React.createElement("button",{key:t.id,onClick:()=>setView(t.id),style:{padding:"6px 10px",borderRadius:5,border:"none",cursor:"pointer",fontSize:9,fontWeight:900,fontFamily:"inherit",background:view===t.id?"linear-gradient(135deg,#00E5A0,#059669)":"transparent",color:view===t.id?C.bg:C.mt,transition:"all .1s"}},t.label))
          )
        )
      )
    ),
    React.createElement("div",{style:{padding:"14px 16px",maxWidth:1320,margin:"0 auto"}},

// ════ DASHBOARD ════
view==="dash"&&React.createElement("div",null,
